<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taste City</title>
<meta name="description" content="Discover places and culture from your taste, or test business launch ideas against an audience in the same 3D Taste City.">
<style>
:root { --ink:#2a2118; --soft:#76695a; --card:rgba(255,250,241,.94); --line:#e6dccb; --good:#2f9e5b; --bad:#d4553a; --accent:#7a4fb0; }
@media (prefers-color-scheme: dark) { :root { --ink:#f3ece0; --soft:#b9ab97; --card:rgba(33,28,22,.92); --line:#43392d; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; overflow:hidden; background:#bfe3f2; color:var(--ink); font:15px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
canvas#scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#labels { position:fixed; inset:0; pointer-events:none; }
#labels .covered { visibility:hidden !important; pointer-events:none !important; }
.tag { position:absolute; transform:translate(-50%,-100%); font-size:12px; font-weight:650; padding:2px 8px; border-radius:99px; background:var(--card); border:1px solid var(--line); white-space:nowrap; }
.say { position:absolute; transform:translate(-50%,-100%); font-size:13px; padding:6px 10px; border-radius:12px; background:#fff; color:#2a2118; box-shadow:0 4px 14px rgba(0,0,0,.15); white-space:nowrap; font-weight:600; }
header { position:fixed; z-index:4; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:max(12px, env(safe-area-inset-top)) 16px 10px; pointer-events:none; }
.city-heading { padding:9px 10px 10px; border:1px solid rgba(42,33,24,.16); border-radius:16px; background:rgba(255,250,241,.95); box-shadow:0 5px 20px rgba(22,17,12,.16); backdrop-filter:blur(12px); }
header h1 { margin:0; font:600 22px/1 ui-serif, Georgia, serif; color:#2a2118; }
.hud { margin-top:5px; font-size:12px; font-weight:650; color:#2a2118; text-shadow:0 1px 0 rgba(255,255,255,.6); display:flex; gap:10px; flex-wrap:wrap; }
.hud b { font-weight:800; }
.hud[hidden] { display:none; }
.growth-control { pointer-events:auto; width:min(310px, calc(100vw - 32px)); margin-top:8px; padding:7px 10px 8px; border:1px solid rgba(42,33,24,.16); border-radius:14px; background:rgba(255,250,241,.9); box-shadow:0 4px 16px rgba(40,30,10,.09); color:#2a2118; }
.growth-copy { display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:11px; font-weight:750; letter-spacing:.02em; }
.growth-copy strong { font:650 16px/1 ui-serif, Georgia, serif; letter-spacing:0; }
.growth-control input { display:block; width:100%; height:18px; margin:4px 0 1px; accent-color:#2f7658; cursor:ew-resize; }
.growth-stops { display:flex; justify-content:space-between; color:#76695a; font-size:9px; font-weight:750; text-transform:uppercase; letter-spacing:.08em; }
.quiet { display:block; margin-top:10px; background:none; border:0; padding:0; color:var(--accent); font:600 13px/1.3 inherit; font-family:inherit; cursor:pointer; text-align:left; }
.mhead { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
.mhead .kind { margin:0; }
.mtitle { font:600 20px/1.15 ui-serif, Georgia, serif; }
.mpair { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.mside { border:1.5px solid var(--line); border-radius:12px; padding:8px; }
.mside input { width:100%; font:inherit; font-size:14px; padding:8px 9px; margin-top:5px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); }
.mside .kind { margin-bottom:2px; }
.mcards { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.mcard { border:1.5px solid var(--line); border-radius:12px; padding:9px; }
.mcard .nm { font-weight:700; font-size:15px; margin:2px 0 3px; }
.mask { margin-top:10px; padding:10px 12px; border-radius:12px; background:var(--ink); color:var(--card); font:500 15px/1.35 ui-serif, Georgia, serif; }
.steps { color:var(--soft); font-size:13px; margin:8px 0 0; min-height:1.4em; }
@media (max-width: 380px) { .mpair, .mcards { grid-template-columns:1fr; } }
.pill { pointer-events:auto; background:var(--card); border:1px solid var(--line); border-radius:99px; padding:6px 12px; font-weight:650; font-size:14px; }
.topnav { pointer-events:auto; display:flex; flex:none; gap:6px; }
.topnav button { border:1px solid rgba(42,33,24,.18); background:rgba(255,250,241,.88); color:#2a2118; border-radius:99px; padding:7px 10px; font:700 12px/1 inherit; box-shadow:0 3px 12px rgba(40,30,10,.08); }
.topnav button[aria-current=true] { background:#2a2118; color:#fffaf1; }
#sheet { position:fixed; z-index:3; left:0; right:0; bottom:0; padding:0 12px max(12px, env(safe-area-inset-bottom)); }
.panel { max-width:640px; max-height:calc(100vh - 150px); overflow:auto; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:0 10px 30px rgba(40,30,10,.18); backdrop-filter:blur(8px); }
.gift { display:flex; gap:12px; align-items:center; }
.gift img, .gift .ph { width:64px; height:84px; object-fit:cover; border-radius:10px; flex:none; background:#e8dcc6; }
.kind { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.gname { font-weight:700; font-size:18px; line-height:1.2; margin:2px 0; }
.hint { color:var(--soft); font-size:13px; }
.ask { margin:10px 0 8px; font-weight:650; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { flex:1 1 30%; min-width:0; display:flex; gap:8px; align-items:center; border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:12px; padding:7px 10px; font:inherit; cursor:pointer; text-align:left; }
.chip .dot { width:12px; height:12px; border-radius:50%; flex:none; }
.chip span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip small { display:block; overflow:hidden; text-overflow:ellipsis; color:var(--soft); font-size:12px; }
.chip.sel { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.prof { margin-top:10px; font-size:13px; color:var(--soft); min-height:2.6em; }
.prof b { color:var(--ink); }
.go { width:100%; margin-top:10px; padding:13px; border:0; border-radius:12px; background:var(--ink); color:var(--card); font:700 16px/1 inherit; font-family:inherit; cursor:pointer; }
.go:disabled { opacity:.4; }
.verdict { font-weight:700; font-size:17px; margin:0 0 4px; }
.verdict.ok { color:var(--good); } .verdict.no { color:var(--bad); }
.why { color:var(--soft); font-size:13px; margin:0; }
.row { display:flex; gap:8px; margin-top:10px; }
.row input { flex:1; min-width:0; font:inherit; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); }
.row button { padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); font:600 15px/1 inherit; font-family:inherit; cursor:pointer; }
a { color:var(--accent); }
details { margin-top:8px; font-size:12px; color:var(--soft); } details ul { max-height:140px; overflow:auto; padding-left:18px; }
.sign { position:absolute; transform:translate(-50%,-50%); font:700 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:4px; background:#6b4a33; color:#fff3dc; white-space:nowrap; }
.outlet-sign { pointer-events:auto; cursor:pointer; border:2px solid #fff8df; border-radius:12px; padding:8px 11px; font-size:12px; box-shadow:0 6px 22px rgba(20,15,10,.28), 0 0 0 3px var(--outlet); background:#241f27; transform:translate(-50%,-100%); }
.outlet-sign:focus-visible { outline:3px solid #fff; outline-offset:4px; }
.qs { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.q { text-align:left; border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:12px; padding:9px 11px; font:600 14px/1.3 inherit; font-family:inherit; cursor:pointer; }
.q small { display:block; font-weight:500; color:var(--soft); font-size:12px; margin-top:2px; }
.stands { margin:8px 0 0; padding-left:18px; font-size:12px; color:var(--soft); max-height:150px; overflow:auto; }
.stands b { color:var(--ink); font-weight:650; }
.dims { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin-top:8px; font-size:13px; }
.dims dt { color:var(--soft); } .dims dd { margin:0; }
.market-title { font:650 26px/1.04 ui-serif, Georgia, serif; letter-spacing:-.025em; margin:4px 0 6px; }
.market-tabs { display:flex; gap:6px; margin:10px 0; }
.market-tabs button { flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:99px; padding:8px; font:700 13px/1 inherit; }
.market-tabs button.on { background:var(--ink); color:var(--card); }
.places { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.place { position:relative; text-align:left; border:1px solid var(--line); background:rgba(255,255,255,.35); color:var(--ink); border-radius:13px; padding:10px; font:inherit; }
.place b { display:block; padding-right:38px; font:650 17px/1.15 ui-serif, Georgia, serif; }
.place small { display:block; margin-top:4px; color:var(--soft); line-height:1.3; }
.taste-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.taste-card { min-height:70px; border:1.5px solid var(--line); background:rgba(255,255,255,.28); color:var(--ink); border-radius:13px; padding:10px; font:650 14px/1.2 inherit; text-align:left; cursor:pointer; }
.taste-card small { display:block; margin-top:5px; color:var(--soft); font-size:11px; font-weight:550; }
.taste-card[aria-pressed=true] { border-color:var(--outlet); box-shadow:0 0 0 2px color-mix(in srgb, var(--outlet) 35%, transparent); background:color-mix(in srgb, var(--outlet) 12%, transparent); }
.local-results { grid-template-columns:1fr; }
.local-place[aria-pressed="true"] { border-color:var(--accent); background:rgba(122,79,176,.10); }
.qloo-results { display:grid; gap:7px; margin:10px 0; }
.qloo-result { display:grid; grid-template-columns:74px 1fr; gap:4px 10px; border:1px solid var(--line); border-radius:12px; padding:9px 10px; }
.qloo-result .kind { grid-row:1/3; align-self:center; }
.qloo-result small { color:var(--soft); overflow-wrap:anywhere; }
.fit { position:absolute; top:8px; right:8px; min-width:34px; padding:3px 6px; border-radius:99px; background:#d9f263; color:#183427; font-size:11px; font-weight:850; text-align:center; }
.reasons { margin:10px 0 0; padding:0; list-style:none; counter-reset:reason; }
.reasons li { position:relative; padding:9px 0 9px 38px; border-top:1px solid var(--line); font-size:13px; }
.reasons li:before { counter-increment:reason; content:counter(reason); position:absolute; left:0; top:8px; display:grid; place-items:center; width:26px; height:26px; border-radius:9px; background:#d9f263; color:#183427; font-weight:850; }
.stat { display:grid; grid-template-columns:72px 1fr; gap:12px; align-items:center; margin:8px 0 12px; }
.score-ring { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(#d9f263 0 77%, rgba(42,33,24,.1) 77%); position:relative; font:700 21px/1 ui-serif, Georgia, serif; }
.score-ring:before { content:""; position:absolute; inset:10px; border-radius:50%; background:var(--card); }
.score-ring span { position:relative; }
.clusters { display:grid; gap:7px; }
.cluster { display:grid; grid-template-columns:1fr auto; gap:3px 10px; font-size:12px; font-weight:700; }
.bar { grid-column:1/-1; height:6px; border-radius:99px; background:rgba(42,33,24,.12); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:inherit; background:#2f7658; }
.sample { margin-top:8px; color:var(--soft); font-size:10px; line-height:1.3; }
.guide { margin:8px 0 10px; font-size:12px; line-height:1.4; }
.guide ol { margin:4px 0 0; padding-left:18px; } .guide li { margin:2px 0; }
.sample-guide { margin:8px 0; padding:8px 10px; border:1px solid rgba(255,255,255,.18); border-radius:10px; font-size:12px; line-height:1.35; }
.taste-card[disabled] { opacity:.45; cursor:not-allowed; }
.brand-form { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
.brand-form label { color:var(--soft); font-size:11px; font-weight:700; }
.brand-form input, .brand-form select { display:block; width:100%; margin-top:4px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:transparent; color:var(--ink); font:600 13px/1.2 inherit; }
.brand-plan { display:grid; gap:7px; margin:10px 0; }
.brand-move { display:grid; grid-template-columns:92px 1fr; gap:4px 9px; padding:9px 10px; border:1px solid var(--line); border-radius:12px; }
.brand-move span { grid-row:1/3; color:var(--accent); font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
.brand-move small { color:var(--soft); overflow-wrap:anywhere; }
.flow-switch { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:9px 0; }
.flow-switch button[aria-current="true"] { background:var(--ink); color:var(--card); }
.scenario-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:9px 0; }
.scenario-summary div { padding:8px; border:1px solid var(--line); border-radius:10px; }
.scenario-summary b { display:block; font-size:15px; }
.archetype-list { display:grid; gap:7px; margin:9px 0; }
.archetype { padding:10px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.55); }
.archetype-head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.archetype p { margin:5px 0; font-size:12px; }
.archetype small { display:block; color:var(--soft); overflow-wrap:anywhere; }
.reject-list { margin:4px 0 8px; padding-left:18px; font-size:12px; }
.idea-compare { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:9px 0; }
.idea-result { padding:9px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.38); }
.idea-result h3 { margin:0; font-size:14px; }
.idea-result .archetype { padding:8px; }
.brand-source { padding:10px; border:1px solid var(--line); border-radius:12px; margin:9px 0; background:rgba(255,255,255,.5); }
.brand-source a { color:var(--accent); overflow-wrap:anywhere; }
.setup-actions { display:grid; gap:7px; margin:10px 0; }
.setup-actions button { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:rgba(255,255,255,.48); color:var(--ink); text-align:left; font:inherit; cursor:pointer; }
.setup-actions button b, .setup-actions button small { display:block; }
.setup-actions button b { font:650 23px/1.12 ui-serif, Georgia, serif; margin:5px 0; }
.setup-actions button { padding:16px; border-left:4px solid #2f7658; }
.setup-actions button:last-child { border-left-color:#7a4fb0; }
.setup-actions button:hover { background:rgba(255,255,255,.8); }
.setup-actions button small { margin-top:3px; color:var(--soft); font-size:12px; }
.setup-city { display:block; margin:10px 0; color:var(--soft); font-size:12px; font-weight:700; }
.setup-city input { display:block; width:100%; margin-top:4px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); font:inherit; }
.reaction { display:inline-block; margin-top:5px; padding:3px 7px; border-radius:99px; background:rgba(47,118,88,.12); color:#255b45; font-size:10px; font-weight:800; }
.spend-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
.spend-grid div { padding:8px; border-radius:10px; background:rgba(47,118,88,.09); font-size:11px; }
.spend-grid b { display:block; font-size:15px; }
.perf-line { color:var(--soft); font-size:10px; }
#load { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; }
#load[hidden] { display:none; }
#load div { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 18px; font-weight:600; }
@media (min-width: 900px) { #sheet { left:auto; right:20px; bottom:20px; width:440px; padding:0; } }
@media (max-width: 600px) {
  header { display:block; padding-left:10px; padding-right:10px; }
  header h1 { font-size:19px; }
  .growth-control { width:100%; margin-top:6px; padding:5px 9px 6px; }
  .topnav { width:100%; margin-top:6px; }
  .topnav button { flex:1; padding:7px 5px; }
  .panel { max-height:calc(100dvh - var(--header-bottom, 188px) - 20px); }
  .brand-form { grid-template-columns:1fr; }
  .idea-compare { grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<header><div class="city-heading"><h1 id="place-title">Taste City</h1><div class="hud" id="hud" hidden></div><div class="growth-control"><div class="growth-copy"><span>Population</span><strong id="population-value">5 · Village</strong></div><input id="population" aria-label="Grow the population" type="range" min="5" max="25" step="1" value="5"><div class="growth-stops"><span>Village</span><span>Town</span><span>City</span></div></div></div><nav class="topnav" aria-label="City views"><button id="navmarket" aria-current="true">For me</button><button id="navorg">For business</button><button id="navfest">3D city</button></nav></header>
<div id="load"><div><div id="loadtxt">Building the city from Qloo…</div><div class="hint" id="loadn"></div></div></div>
<div id="sheet"><div class="panel" id="panel" hidden></div></div>
<script type="module">
import * as THREE from "./vendor/three.module.min.js";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q = new URLSearchParams(location.search);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- scene ---------- */
const canvas = $("#scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const DAY_SECONDS = 60;
const daySky = new THREE.Color(0xbfe3f2), duskSky = new THREE.Color(0xd98572), nightSky = new THREE.Color(0x101936);
scene.background = daySky.clone();
scene.fog = new THREE.Fog(0xd8eef2, 60, 130);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 400);
const skyLight = new THREE.HemisphereLight(0xfff4dc, 0x6c8f4e, 1.5); scene.add(skyLight);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.4); sun.position.set(-18, 30, 14); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -64, right: 64, top: 64, bottom: -64, far: 160 }); sun.shadow.bias = -0.0006;
scene.add(sun);
const moonLight = new THREE.DirectionalLight(0x9db8ff, 0.25); scene.add(moonLight);
const sunOrb = new THREE.Mesh(new THREE.SphereGeometry(3.2, 20, 20), new THREE.MeshBasicMaterial({ color:0xffd45c })); scene.add(sunOrb);
const moon = new THREE.Mesh(new THREE.SphereGeometry(2.5, 20, 20), new THREE.MeshBasicMaterial({ color:0xe8efff })); scene.add(moon);
const windowMaterials = [];

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o });
const add = (mesh, parent = scene, shadow = true) => { mesh.castShadow = shadow; mesh.receiveShadow = true; parent.add(mesh); return mesh; };

// island, plaza, paths, pond
add(new THREE.Mesh(new THREE.CylinderGeometry(64, 60, 3, 96), [mat(0x8a6a48), mat(0x86c46a), mat(0x8a6a48)]), scene, false).position.y = -1.5;
// four roads leave the plaza; a street of five moves in along each one while you play
const ROADS = [-54, 90, 162, 234].map(d => d * Math.PI / 180), ROAD_FROM = 15, ROAD_TO = 58;
const nearRoad = (x, z, w) => ROADS.some(a => { const along = x * Math.cos(a) + z * Math.sin(a), off = Math.abs(-x * Math.sin(a) + z * Math.cos(a));
  return along > ROAD_FROM - 3 && off < w; });
for (const a of ROADS) { const len = ROAD_TO - ROAD_FROM, mid = (ROAD_FROM + ROAD_TO) / 2;
  const road = add(new THREE.Mesh(new THREE.PlaneGeometry(len, 2.4), mat(0xe2d3b4)), scene, false);
  road.rotation.x = -Math.PI / 2; road.rotation.z = -a; road.position.set(Math.cos(a) * mid, 0.025, Math.sin(a) * mid); }
add(new THREE.Mesh(new THREE.CircleGeometry(5.2, 48), mat(0xe9dcc0)), scene, false).rotation.x = -Math.PI / 2;
scene.children.at(-1).position.y = 0.02;
const pond = add(new THREE.Mesh(new THREE.CircleGeometry(3.2, 40), mat(0x6fb6d8, { roughness: 0.2, metalness: 0.1 })), scene, false);
pond.rotation.x = -Math.PI / 2; pond.position.set(9, 0.03, 9); pond.scale.set(1.4, 1, 1);

/* ---------- population infrastructure: one map, three densities ---------- */
const townLayer = new THREE.Group(), cityLayer = new THREE.Group(), subwayLayer = new THREE.Group(), festivalLayer = new THREE.Group();
scene.add(townLayer, cityLayer, subwayLayer, festivalLayer);
const makeBlock = (parent, x, z, w, d, h, color) => {

async function runMatch() {

function lightUp(names) {

async function runAsk(q, arg) {

    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q, arg, city: { villagers: CITY.map(compact) } }) });
    const a = await r.json();
    if (!r.ok || a.error) throw new Error(a.error || r.status);
    if ((a.problems || []).length) throw new Error("the answer cited something the city does not hold: " + a.problems.join("; "));
    renderAnswer(a);
  } catch (e) { if ($("#csteps")) { $("#csteps").textContent = "That did not work: " + e.message; panel.querySelectorAll("button").forEach(b => b.disabled = false); } }

function renderAnswer(a) {

  $("#cmore").onclick = openCity; $("#cback").onclick = backToGame;
}
function openPerson(c) {

  g.font = "52px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("❤️", 32, 36); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();

function updateDayNight(elapsed) {

  const angle = phase * Math.PI * 2, height = Math.sin(angle), daylight = Math.max(0, Math.min(1, height * 1.8 + .18));

  sunOrb.position.copy(sun.position).normalize().multiplyScalar(120); sunOrb.visible = height > -.12;
  moon.position.copy(sunOrb.position).multiplyScalar(-1); moon.visible = height < .22;
  const sky = nightSky.clone().lerp(daySky, daylight).lerp(duskSky, dusk * .48); scene.background.copy(sky); scene.fog.color.copy(sky);

    const tipT = setInterval(() => { tip = Math.min(tip + 1, tips.length - 1); $("#loadtxt").textContent = tips[tip] + "…"; }, 2500);
    const nT = setInterval(() => { $("#loadn").textContent = q.get("demo") === "1" ? "Loading labelled fictional sample." : `${planned} live Qloo calls to enter. ${Math.round((performance.now() - started) / 1000)} s so far.`; }, 250);
    const params = new URLSearchParams(); if (q.get("me")) params.set("me", q.get("me")); if (q.get("loves")) params.set("loves", q.get("loves"));
    villagePromise = (q.get("demo") === "1" ? Promise.resolve(DEMO_VILLAGE) : fetch("/api/village?" + params).then(r => r.json()))
      .then(d => { if (d.error || !d.villagers) throw new Error(d.error || "no village"); buildVillage(d); growCity(d); return d; })
      .catch(e => { villagePromise = null; throw e; })
      .finally(() => { clearInterval(tipT); clearInterval(nT); });
  }
  return villagePromise.then(d => {
    $("#load").hidden = true;
    setupStarted = false;
    target === "brand" ? openBrandPlanner() : target === "game" ? backToGame() : openMarket();
    requestAnimationFrame(() => requestAnimationFrame(() => { document.body.dataset.firstPaintMs = String(Math.round(performance.now())); }));
    setTimeout(() => say(MM, "Tap me when you have a friend in mind.", 3200), 1500);
    return d;
  }).catch(e => {
    $("#load").hidden = true; panel.hidden = false;
    panel.innerHTML = `<div class="kind">City unavailable</div><div class="market-title">The villagers did not load</div><p>${esc(e.message)}</p><button id="retrycity" class="go">Try entering again</button><button id="backsetup" class="quiet">Back to setup</button>`;
    $("#retrycity").onclick = () => enterCity(target); $("#backsetup").onclick = openSetup;
  });
}
if (q.get("setup") === "1") openSetup();
else if (q.get("demo") === "1") enterCity(q.get("judge") === "1" ? "brand" : "market");
else if (q.get("judge") === "1") openBrandPlanner();
else openSetup();
</script>
</body>
</html>
